[versions]
agp = "9.4.1"
core = "1.15.0"
appcompat = "1.7.1"
material = "1.12.0"
constraintLayout = "2.2.1"
fragment = "1.8.5"
lifecycle = "2.8.7"
navigation = "2.8.9"
