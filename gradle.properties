# Configuración general de Gradle para el proyecto.
# Android Studio puede sobrescribir algunas opciones desde la configuración del IDE.
# Argumentos de memoria y codificación usados por el proceso de Gradle.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# La caché de configuración evita repetir fases de configuración sin cambios relevantes.
org.gradle.configuration-cache=true

# Estilo de código de Kotlin usado por herramientas que lo requieran.
kotlin.code.style=official
